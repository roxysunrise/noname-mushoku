<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>无名杀 · 山河入局</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main class="scene">
    <header><span class="edition">三国风云 · 群英入局</span><nav><button id="logs">更新日志</button></nav></header>
    <div class="title"><span class="seal" aria-hidden="true">群英</span><h1>无名杀</h1><p>一局山河，万般谋略</p></div>
    <section class="loading" aria-label="游戏加载与更新">
      <div class="status-line"><span id="status" role="status" aria-live="polite">正在检查更新…</span><span id="version">Android</span></div>
      <div id="progress" class="track busy" role="progressbar" aria-label="下载进度"><div id="fill"></div></div>
      <div class="metrics"><span>安卓资源更新</span><span>下载后校验 SHA-256</span><span>重启后加载</span></div>
      <div class="actions"><button id="check">检查更新</button><button id="enter" class="primary">进入游戏</button></div>
      <footer><span>Android 客户端</span><span>抵制不良游戏 · 拒绝盗版游戏 · 适度游戏益脑</span></footer>
    </section>
  </main>
  <script type="module" src="android-launcher.mjs"></script>
</body>
</html>
